<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"
  aria-label="陈刑OS">
  <!-- hard-edged shadow -->
  <rect x="4" y="4" width="60" height="60" fill="#000000" />
  <!-- sky-blue square with dark navy border -->
  <rect x="2" y="2" width="56" height="56" fill="#92c1d3" stroke="#0f172a" stroke-width="4" />
  <!-- Chinese character top left -->
  <text
    text-anchor="start"
    x="8"
    y="36"
    fill="#0f172a"
    font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif"
    font-weight="750"
    font-size="32"
  >
    刑
  </text>
</svg>